[package]
name = "stagehand"
version = "0.5.2"
edition = "2021"
description = "A guided, terminal-based Gentoo Linux installer"
license = "MIT"
repository = "https://github.com/dme86/Stagehand"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
serde_json = "1"
sha2 = "0.10"

serde = { version = "1", features = ["derive"] }
libc = "0.2"
